<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Contact Me</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="contact-form">
    <h2>ติดต่อเรา (Contact Form)</h2>
    <form action="#" method="POST">
      <label for="name">ชื่อ-นามสกุล:</label>
      <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ..." required>

      <label for="email">อีเมล:</label>
      <input type="email" id="email" name="email" placeholder="กรอกอีเมลของคุณ..." required>

      <label for="message">ข้อความ:</label>
      <textarea id="message" name="message" rows="4" placeholder="พิมพ์ข้อความที่นี่..." required></textarea>

      <button type="submit" class="btn-contact" style="width: 100%; border: none; cursor: pointer;">ส่งข้อความ</button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
      <a href="index.html">← กลับสู่หน้าหลัก</a>
    </div>
  </div>

</body>
</html>
